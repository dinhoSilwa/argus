[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-mcp-cli"
version = "0.1.0"
description = "Argus MCP server — ferramentas de engenharia para agentes de IA"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
argus-mcp = "argus_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
